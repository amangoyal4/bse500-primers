name = "bse500-refresh"
main = "worker.js"
compatibility_date = "2024-11-01"

# Public, non-secret config. Edit GH_OWNER/GH_REPO/ALLOW_ORIGIN if you fork or rename.
[vars]
ALLOW_ORIGIN = "https://amangoyal4.github.io"
GH_OWNER = "amangoyal4"
GH_REPO = "bse500-primers"

# SECRETS — never put these in this file. Set them once after `wrangler deploy`:
#   wrangler secret put GH_TOKEN         # a fine-grained GitHub PAT (this repo only, Contents: read+write)
#   wrangler secret put REFRESH_PASSWORD # the shared password the ⟳ button will prompt for
