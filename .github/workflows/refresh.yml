name: Refresh primers (re-true to present)

# Auto-applies: re-trues the watchlist primers and commits straight to the live site.
# No review — safety is enforced in code (surgical exact-match + no-invented-numbers guard);
# every change is still a reversible git commit. Add a cron below to run on a schedule.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *'   # daily at 02:00 UTC — uncomment to auto-run

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-true watchlist primers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node refresh/scan.mjs

      - name: Commit updated primers straight to the live site
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "primer-refresh"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "refresh: re-true watchlist primers to present"
            git push
          else
            echo "No changes — every watchlist primer is already current."
          fi
